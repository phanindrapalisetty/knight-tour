name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:            # adds a "Run workflow" button for testing

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # needed to create the GitHub Release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: package.json, cache: npm }
      - run: npm ci
      - run: npm test
      - run: node scripts/check-release.mjs
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "release-notes/$GITHUB_REF_NAME.md" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: release              # only deploy if tests and checks passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: package.json, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /knight-tour/
      - uses: actions/upload-pages-artifact@v4
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
