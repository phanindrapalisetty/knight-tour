name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json   # reads "engines.node"
          cache: npm
      - run: npm ci                          # clean install from package-lock.json
      - run: npm test
      - run: npm run build
      - run: node scripts/check-release.mjs

